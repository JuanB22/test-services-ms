include:
  - project: checkbox-innovations/gis/tools/test-template/test-services
    ref: main
    file:
      - template-services-test.yaml

workflow:
  rules:
    # Correr para Merge Requests (para los jobs 'Test')
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Correr para branches 'nonprod-*'
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev" || $CI_COMMIT_BRANCH == "nonprod-demo"'
    # Correr para CUALQUIER tag
    - if: '$CI_COMMIT_TAG'

# (Optional) It redifines a new script for template_build
.template_build:
  extends: .template_build_base
  script:
    - |
      if [ ! -f .skip_build ]; then
        echo "--- Starting CUSTOM Build Script ---"
        docker build -t build-cache-image .
        echo "--- CUSTOM Build Script Finished ---"
      else
        echo "--- CUSTOM Build Script Skipped (Rollback) ---"
      fi

################# JOBS NONPROD DEV ##################
Test nonprod-dev:
  extends:
    - .template_test_java
    - .common_variables
    - .nonprod_dev_variables
  environment: nonprod-dev
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nonprod-dev"'

Build and push image nonprod-dev:
  extends:
    - .template_build
    - .common_variables
    - .nonprod_dev_variables
  environment: nonprod-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev"'

Update microservice nonprod-dev:
  extends:
    - .template_update
    - .common_variables
    - .nonprod_dev_variables
  needs:
    - "Build and push image nonprod-dev"
  environment: nonprod-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev"'

################# JOBS NONPROD DEMO ##################
Test nonprod-demo:
  extends:
    - .template_test_java
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nonprod-demo"'

Build and push image nonprod-demo:
  extends:
    - .template_build
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-demo"'

Update microservice nonprod-demo:
  extends:
    - .template_update
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  needs:
    - "Build and push image nonprod-demo"
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-demo"'

################# JOBS MULTIPROD ##################
# 1. Job Recolector (Limpio)
gather_ecr_configs:
  extends:
    - .logic_gather_ecr      # Trae el script complejo del template
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list  # Trae la matriz de ambientes
  environment: $STAGE
  rules:
    - if: '$CI_COMMIT_TAG'

Test:
  extends:
    - .template_test_java
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list
  environment: $STAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

Build and push image:
  stage: build
  extends:
    # - .template_build
    - .common_variables
    - .multiprod_variables
  needs: ["gather_ecr_configs"]
  id_tokens:
    CI_JOB_JWT_V2:
      aud: https://gitlab.com
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "--- Starting Unified Build ---"
    
    # Verificamos destinos
    - if ! ls ecr_target_*.txt 1> /dev/null 2>&1; then echo "No targets found for this tag"; exit 1; fi
    - cat ecr_target_*.txt > deploy_targets.list

    # --- AQUÍ ESTÁ EL CAMBIO ---
    # Invocamos el script de login definido en el template
    - !reference [.aws_auth_script, script]
    
    # Tu lógica de Build
    - docker build -t build-cache-image .

    # Invocamos el loop de push (asumiendo que agregaste .logic_push_multiprod_loop al template como vimos antes)
    - !reference [.logic_push_multiprod_loop, script]

Update microservice:
  extends:
    - .template_update
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list
  needs: ["Build and push image"]
  environment: $STAGE
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  when: manual
