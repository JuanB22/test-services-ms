include:
  - project: checkbox-innovations/gis/tools/test-template/test-services
    ref: main
    file:
      - template-services-test.yaml

workflow:
  rules:
    # Correr para Merge Requests (para los jobs 'Test')
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Correr para branches 'nonprod-*'
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev" || $CI_COMMIT_BRANCH == "nonprod-demo"'
    # Correr para CUALQUIER tag
    - if: '$CI_COMMIT_TAG'

# (Optional) It redifines a new script for template_build
.template_build:
  extends: .template_build_base
  script:
    - |
      if [ ! -f .skip_build ]; then
        echo "--- Starting CUSTOM Build Script ---"
        docker build -t ${AWS_ECR_IMAGE} --build-arg ENVIRONMENT=${CI_ENVIRONMENT_NAME} .
        docker tag ${AWS_ECR_IMAGE} ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${AWS_ECR_IMAGE}:${FINAL_IMAGE_TAG}
        docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${AWS_ECR_IMAGE}:${FINAL_IMAGE_TAG}
        echo "--- CUSTOM Build Script Finished ---"
      else
        echo "--- CUSTOM Build Script Skipped (Rollback) ---"
      fi

################# JOBS NONPROD DEV ##################
Test nonprod-dev:
  extends:
    - .template_test_java
    - .common_variables
    - .nonprod_dev_variables
  environment: nonprod-dev
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nonprod-dev"'

Build and push image nonprod-dev:
  extends:
    - .template_build
    - .common_variables
    - .nonprod_dev_variables
  environment: nonprod-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev"'

Update microservice nonprod-dev:
  extends:
    - .template_update
    - .common_variables
    - .nonprod_dev_variables
  needs:
    - "Build and push image nonprod-dev"
  environment: nonprod-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-dev"'

################# JOBS NONPROD DEMO ##################
Test nonprod-demo:
  extends:
    - .template_test_java
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nonprod-demo"'

Build and push image nonprod-demo:
  extends:
    - .template_build
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-demo"'

Update microservice nonprod-demo:
  extends:
    - .template_update
    - .common_variables
    - .nonprod_demo_variables
  environment: nonprod-demo
  needs:
    - "Build and push image nonprod-demo"
  rules:
    - if: '$CI_COMMIT_BRANCH == "nonprod-demo"'

################# JOBS MULTIPROD ##################
# 1. Job Recolector (Limpio)
gather_ecr_configs:
  extends:
    - .logic_gather_ecr
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list
  environment: $STAGE
  rules:
    - if: '$CI_COMMIT_TAG'

Test:
  extends:
    - .template_test_java
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list
  environment: $STAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

Build and push image:
  stage: build
  extends:
    - .template_build_unified_multiprod
    - .common_variables
    - .multiprod_variables
  needs: ["gather_ecr_configs"]
  rules:
    - if: '$CI_COMMIT_TAG'

Update microservice:
  extends:
    - .template_update
    - .common_variables
    - .multiprod_variables
    - .multiprod_stage_list
  needs: ["Build and push image"]
  environment: $STAGE
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  when: manual
