name: Test Service CI/CD

on:
  # Equivale a $CI_PIPELINE_SOURCE == "merge_request_event"
  pull_request:
    branches:
      - nonprod-dev
      # - nonprod-demo
  # Equivale a correr en branches específicas y tags
  push:
    branches:
      - nonprod-dev
      # - nonprod-demo
    tags:
      - '*' # Ejecuta en cualquier tag (multiprod)
      
  # GATILLO MANUAL (REEMPLAZA EL WHEN: MANUAL)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente a afectar'
        type: choice
        required: true
        default: 'nonprod-dev'
        options: 
          - nonprod-dev
          - nonprod-demo
          - prod
      accion:
        description: 'Qué hace este run'
        type: choice
        required: true
        default: 'build (solo compilar y subir imagen)'
        options:
          - 'build (solo compilar y subir imagen)'
          - 'deploy (actualizar microservicio en AWS)'
      image_tag:
        description: 'Tag de la imagen a desplegar (ej. hash corto del commit). Solo necesario para deploy.'
        type: string
        required: false
        default: 'latest'

env:
  APP_NAME: test
  AWS_REGION: us-east-1 # Cambiar por tu región por defecto
  ECR_REPOSITORY: siges-nonprod-dev-test # Nombre de tu repo en ECR

permissions:
  id-token: write # Requerido para AWS OIDC
  contents: read

jobs:
  # ==========================================
  # 1. TEST (Solo en Pull Requests)
  # ==========================================
  test:
    name: Test (Java)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto' # Coincide con tu imagen base
          cache: maven

      - name: Ejecutar Tests
        run: mvn -f pom.xml test

  # ==========================================
  # 2. BUILD & PUSH A ECR (Automático en Push o Manual)
  # ==========================================
  build-and-push:
    name: Build & Push Image
    # Corre si es un push automático o si se dispara manual eligiendo 'build'
    if: github.event_name == 'push' || startsWith(inputs.accion, 'build')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Definir si es dev, demo o prod dependiendo de la rama/tag o del input manual
      - name: Determinar Entorno y Tag
        id: set-tag
        env:
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "PROFILE=prod" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "ENV_NAME=$BRANCH_NAME" >> $GITHUB_ENV
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            
            if [ "$BRANCH_NAME" = "nonprod-dev" ] || [ "$INPUT_ENV" = "nonprod-dev" ]; then
              echo "PROFILE=dev" >> $GITHUB_ENV
            elif [ "$BRANCH_NAME" = "nonprod-demo" ] || [ "$INPUT_ENV" = "nonprod-demo" ]; then
              echo "PROFILE=demo" >> $GITHUB_ENV
            fi
          fi

      - name: Ejecutar scripts de configuración (Python)
        run: |
          # Reemplaza los placeholders en application.properties
          python config-infrastructure.py \
            "${{ secrets.DATABASE_URL }}" \
            "${{ secrets.DATABASE_USER }}" \
            "${{ secrets.DATABASE_PW }}" \
            "${{ env.AWS_REGION }}" \
            "${{ secrets.AWS_ACCOUNT_ID }}" \
            "${{ secrets.PRESCRIPTION_BEARER_TOKEN }}"
          
          # # Reemplaza los placeholders en application.yml
          # python config-profile.py "${{ env.PROFILE }}"
      
      - name: 🔍 DEBUG - Extraer Token OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log("=========================================");
            console.log("Copia este valor en tu StringLike de AWS:");
            console.log(payload.sub);
            console.log("=========================================");

      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125568768:role/test-service-role-oidc
          role-session-name: GitHubActions-Build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.set-tag.outputs.TAG }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG --build-arg ENVIRONMENT=${{ env.ENV_NAME }} .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "Imagen pusheada: $REGISTRY/$ECR_REPOSITORY:$TAG"

  # ==========================================
  # 3. UPDATE MICROSERVICE (Únicamente Manual)
  # ==========================================
  deploy:
    name: Update Microservice
    # Corre ÚNICAMENTE cuando presionas el botón manual y eliges 'deploy'
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.accion, 'deploy')
    runs-on: ubuntu-latest
    
    steps:
      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Usando el mismo rol exacto que tienes en el paso de Build
          role-to-assume: arn:aws:iam::211125568768:role/test-service-role-oidc
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar Servicio en AWS
        env:
          ENV_NAME: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "========================================="
          echo "Iniciando despliegue manual"
          echo "Entorno objetivo: $ENV_NAME"
          echo "Aplicando imagen con tag: $IMAGE_TAG"
          echo "========================================="
          
          # AQUÍ DEBES PONER EL COMANDO EXACTO PARA ACTUALIZAR TU SERVICIO
          # Ejemplo para ECS:
          # aws ecs