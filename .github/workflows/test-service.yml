name: Test Service CI/CD

on:
  pull_request:
    branches:
      - nonprod-dev
  push:
    branches:
      - nonprod-dev
    tags:
      - '*' 

env:
  APP_NAME: test
  AWS_REGION: us-east-1
  ECR_REPOSITORY: siges-nonprod-dev-test

permissions:
  id-token: write 
  contents: read

jobs:
  # ==========================================
  # 1. TEST (Solo en Pull Requests)
  # ==========================================
  test:
    name: Test (Java)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto' 
          cache: maven

      - name: Ejecutar Tests
        run: mvn -f pom.xml test

  # ==========================================
  # 2. BUILD & PUSH A ECR
  # ==========================================
  build-and-push:
    name: Build & Push Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Determinar Entorno y Tag
        id: set-tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "PROFILE=prod" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "ENV_NAME=$BRANCH_NAME" >> $GITHUB_ENV
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            
            if [ "$BRANCH_NAME" = "nonprod-dev" ]; then
              echo "PROFILE=dev" >> $GITHUB_ENV
            elif [ "$BRANCH_NAME" = "nonprod-demo" ]; then
              echo "PROFILE=demo" >> $GITHUB_ENV
            fi
          fi

      - name: Ejecutar scripts de configuración (Python)
        run: |
          python config-infrastructure.py \
            "${{ secrets.DATABASE_URL }}" \
            "${{ secrets.DATABASE_USER }}" \
            "${{ secrets.DATABASE_PW }}" \
            "${{ env.AWS_REGION }}" \
            "${{ secrets.AWS_ACCOUNT_ID }}" \
            "${{ secrets.PRESCRIPTION_BEARER_TOKEN }}"
      
      - name: 🔍 DEBUG - Extraer Token OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log("=========================================");
            console.log("Copia este valor en tu StringLike de AWS:");
            console.log(payload.sub);
            console.log("=========================================");

      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125568768:role/test-service-role-oidc
          role-session-name: GitHubActions-Build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.set-tag.outputs.TAG }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG --build-arg ENVIRONMENT=${{ env.ENV_NAME }} .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "Imagen pusheada: $REGISTRY/$ECR_REPOSITORY:$TAG"

  # ==========================================
  # 3. UPDATE MICROSERVICE (Pausa Nativa)
  # ==========================================
  deploy:
    name: Update Microservice
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Esto vincula el job con la regla de aprobación configurada en GitHub.
    # Toma automáticamente el nombre de la rama (ej. nonprod-dev).
    environment: 
      name: ${{ github.ref_name }}
    
    steps:
      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125568768:role/test-service-role-oidc
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar Servicio en AWS
        env:
          ENV_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "========================================="
          echo "Iniciando despliegue post-aprobación"
          echo "Entorno objetivo: $ENV_NAME"
          echo "Aplicando imagen con tag: $IMAGE_TAG"
          echo "========================================="
          
          # AQUÍ DEBES PONER EL COMANDO EXACTO PARA ACTUALIZAR TU SERVICIO
          # aws ecs ...