name: Test Service CI/CD

on:
  # Equivale a $CI_PIPELINE_SOURCE == "merge_request_event"
  pull_request:
    branches:
      - nonprod-dev
      # - nonprod-demo
  # Equivale a correr en branches específicas y tags
  push:
    branches:
      - nonprod-dev
      # - nonprod-demo
    tags:
      - '*' # Ejecuta en cualquier tag (multiprod)

env:
  APP_NAME: test
  AWS_REGION: us-east-1 # Cambiar por tu región por defecto
  ECR_REPOSITORY: test-service # Nombre de tu repo en ECR

permissions:
  id-token: write # Requerido para AWS OIDC
  contents: read

jobs:
  # ==========================================
  # 1. TEST (Solo en Pull Requests)
  # ==========================================
  test:
    name: Test (Java)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto' # Coincide con tu imagen base
          cache: maven

      - name: Ejecutar Tests
        run: mvn -f pom.xml test

  # ==========================================
  # 2. BUILD & PUSH A ECR (Ramas y Tags)
  # ==========================================
  build-and-push:
    name: Build & Push Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Definir si es dev, demo o prod dependiendo de la rama/tag
      - name: Determinar Entorno y Tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "PROFILE=prod" >> $GITHUB_ENV
          else
            # Extrae el nombre de la rama (nonprod-dev o nonprod-demo)
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "ENV_NAME=$BRANCH_NAME" >> $GITHUB_ENV
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT # Tag corto del commit
            
            if [[ "$BRANCH_NAME" == "nonprod-dev" ]]; then
              echo "PROFILE=dev" >> $GITHUB_ENV
            elif [[ "$BRANCH_NAME" == "nonprod-demo" ]]; then
              echo "PROFILE=demo" >> $GITHUB_ENV
            fi
          fi

      - name: Ejecutar scripts de configuración (Python)
        run: |
          # Reemplaza los placeholders en application.properties
          python config-infrastructure.py \
            "${{ secrets.DATABASE_URL }}" \
            "${{ secrets.DATABASE_USER }}" \
            "${{ secrets.DATABASE_PW }}" \
            "${{ env.AWS_REGION }}" \
            "${{ secrets.AWS_ACCOUNT_ID }}" \
            "${{ secrets.PRESCRIPTION_BEARER_TOKEN }}"
          
          # # Reemplaza los placeholders en application.yml
          # python config-profile.py "${{ env.PROFILE }}"

      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/tu-rol-oidc
          role-session-name: GitHubActions-Build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.set-tag.outputs.TAG }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG --build-arg ENVIRONMENT=${{ env.ENV_NAME }} .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "Imagen pusheada: $REGISTRY/$ECR_REPOSITORY:$TAG"

  # ==========================================
  # 3. UPDATE MICROSERVICE (Despliegue)
  # ==========================================
  deploy:
    name: Update Microservice
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Asigna el entorno dinámicamente. 
    # Si es un Tag, le asignará 'multiprod' (o el nombre que uses).
    # Si es multiprod, debes configurarlo en GitHub Settings para requerir aprobación manual.
    environment: 
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'multiprod' || github.ref_name }}
    
    steps:
      - name: Checkout del código (Opcional, si el script de deploy lo requiere)
        uses: actions/checkout@v4

      - name: Autenticación AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/tu-rol-oidc
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar Servicio en AWS (Reemplazo de .template_update)
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Actualizando microservicio a la versión $IMAGE_TAG..."
          # AQUÍ DEBES PONER EL COMANDO EXACTO PARA ACTUALIZAR TU SERVICIO
          # Ejemplo para ECS:
          # aws ecs update-service --cluster tu-cluster --service appointment-service --force-new-deployment
          
          # Ejemplo para Kubernetes/EKS:
          # kubectl set image deployment/appointment appointment=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG